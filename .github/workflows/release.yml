name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build or retry (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate committed version and tag
        run: node scripts/release.mjs validate-tag --tag "$RELEASE_TAG"
      - name: Test release safeguards and notes
        run: node --test scripts/tests/release.test.mjs

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux_x86_64
            bundles: deb,appimage
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows_x86_64
            bundles: nsis
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos_aarch64
            bundles: dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos_x86_64
            bundles: dmg
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - name: Install Rust
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add "$BUILD_TARGET" --toolchain 1.90.0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libcurl4-openssl-dev libssl-dev libxdo-dev librsvg2-dev patchelf libfuse2 file desktop-file-utils xdg-utils
      - uses: swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release.mjs validate-tag --tag "$RELEASE_TAG"
      - name: Run native Rust tests
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo test --workspace --locked --target "$BUILD_TARGET"
      - name: Check proxy protocols on the Linux packaging baseline
        if: runner.os == 'Linux'
        run: make test-integration
      - name: Build platform installers
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_BUNDLES: ${{ matrix.bundles }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm tauri build --target "$BUILD_TARGET" --bundles "$BUILD_BUNDLES" -- --locked
      - name: Collect required versioned assets
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          node scripts/version.mjs check
          git diff --exit-code -- VERSION package.json Cargo.toml Cargo.lock src-tauri/tauri.conf.json
          node scripts/release-assets.mjs collect --target "$BUILD_TARGET" --platform "$BUILD_PLATFORM" --out artifacts/release
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts/release
          merge-multiple: true
      - name: Publish complete release with commit links and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs artifacts/release
