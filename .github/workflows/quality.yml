name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - run: rustup toolchain install 1.90.0 --component rustfmt,clippy --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libcurl4-openssl-dev libssl-dev libxdo-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: node scripts/version.mjs check
      - run: pnpm format:check
      - run: make lint test test-release test-integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: make test-ui
        env:
          CHROME_PATH: ''
      - run: make build-debug
      - uses: actions/upload-artifact@v4
        with:
          name: linux-debug-and-test-results
          path: |
            target/debug/proxy-vouch
            artifacts/*results.json
